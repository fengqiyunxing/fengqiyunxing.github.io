packages:
  - '.'
allowBuilds:
  esbuild: true
  workerd: true

# 【个性化改造】切到 hoisted linker（扁平 node_modules，无符号链接拓扑）
# 原因：本环境下 pnpm 11 isolated 模式的 linking 阶段反复被超时/中断，导致 .pnpm 已就位但
#       顶层 symlink 与 .bin 始终未生成。hoisted 模式像 npm 一样直接放依赖到 node_modules，
#       不依赖复杂 symlink 拓扑，是确定能跑通的方案。
nodeLinker: hoisted

overrides:
  "stylus>glob": "^14.0.6"
  "js-yaml@4.3.1": "^4.3.2"
  "katex@0.16.47": "^0.18.3"
  "postcss-selector-parser@>=6.0.0 <6.1.5": "^6.1.6"
  "rollup-plugin-terser>serialize-javascript": "^7.1.3"
  "miniflare>sharp": "^0.35.5"
  "miniflare>undici": "^7.30.2"
